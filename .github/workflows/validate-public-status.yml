name: Validate public status

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require exact generated publication
        run: python3 scripts/render_status.py
      - name: Run publication contract tests
        run: python3 -m unittest discover -s tests -v
